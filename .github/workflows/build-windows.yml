name: Build Windows Electron App

on:
  push:
    branches: [ "**" ]

  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install dependencies
        run: yarn install --network-timeout 300000

      - name: Build Vite (React UI)
        run: yarn build

      - name: Build Electron installer
        run: yarn build:electron --win --publish=never

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-windows-installer
          path: dist-electron/**
